name: Release

# Pushing a v* tag builds every platform and publishes a GitHub release.
# Running it by hand builds the same archives as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # No dependencies, so there is no go.sum to key a cache on.
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="discord_${VERSION#v}_${os}_${arch}"
            exe=discord
            if [ "$os" = windows ]; then exe=discord.exe; fi
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/$exe" ./cmd/discord
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
